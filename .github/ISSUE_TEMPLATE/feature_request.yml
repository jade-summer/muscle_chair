name: 機能提案
description: 新機能や改善を提案する
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: どのような場面で困っているかを記述してください
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案する解決策
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案

  - type: textarea
    id: context
    attributes:
      label: 補足
      description: 参考リンク、配線図、スケッチなど
