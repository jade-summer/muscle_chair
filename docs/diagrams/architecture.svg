<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 680" width="880" height="680" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', Meiryo, sans-serif">
  <title id="title">Muscle Chair システム構成図</title>
  <desc id="desc">骨格検知用のRaspberry Pi Zero 2 WとPCがWebSocketで接続され、タッチセンサーとあわせてRaspberry Pi 4へHTTPでポイントを報告する。Pi 4は勝利判定後に4台の出力用Raspberry Pi Zeroへ一斉に命令を送信し、ブラウザはPi 4のステータスを1秒ごとに取得する。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-win" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bc4c00"/>
    </marker>
  </defs>

  <rect width="880" height="680" fill="#ffffff"/>

  <!-- 入力: 骨格検知 -->
  <rect x="40" y="50" width="300" height="104" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="190" y="78" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2328">Raspberry Pi Zero 2 W</text>
  <text x="190" y="99" text-anchor="middle" font-size="11.5" fill="#57606a">skeleton_cam/server.py</text>
  <text x="190" y="119" text-anchor="middle" font-size="11.5" fill="#1f2328">Pi Camera + MediaPipe Pose</text>
  <text x="190" y="139" text-anchor="middle" font-size="11.5" fill="#1f2328">骨格検出 → 関節角度の算出</text>

  <!-- 入力: タッチセンサー -->
  <rect x="540" y="50" width="300" height="104" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="690" y="86" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2328">Raspberry Pi Zero</text>
  <text x="690" y="107" text-anchor="middle" font-size="11.5" fill="#57606a">device/input/touch/input_touch_a.js</text>
  <text x="690" y="128" text-anchor="middle" font-size="11.5" fill="#1f2328">タッチセンサー（GPIO 5）</text>

  <!-- PC -->
  <rect x="40" y="210" width="300" height="96" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="190" y="240" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2328">PC</text>
  <text x="190" y="262" text-anchor="middle" font-size="11.5" fill="#57606a">skeleton_cam/client.py</text>
  <text x="190" y="284" text-anchor="middle" font-size="11.5" fill="#1f2328">回数カウント（角度のしきい値で判定）</text>

  <line x1="190" y1="154" x2="190" y2="204" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="203" y="174" font-size="11" fill="#1f2328">WebSocket :8765</text>
  <text x="203" y="191" font-size="11" fill="#57606a">映像 + 関節角度</text>

  <!-- 中央サーバー -->
  <rect x="140" y="370" width="360" height="120" rx="8" fill="#ddf4ff" stroke="#218bff"/>
  <text x="320" y="399" text-anchor="middle" font-size="14.5" font-weight="600" fill="#0a3069">Raspberry Pi 4</text>
  <text x="320" y="419" text-anchor="middle" font-size="11.5" fill="#0a3069">backend/main.py — FastAPI :8000</text>
  <line x1="170" y1="432" x2="470" y2="432" stroke="#218bff" stroke-opacity="0.45"/>
  <text x="320" y="453" text-anchor="middle" font-size="11.5" fill="#1f2328">ポイント換算 → ゲージ加算 → 勝利判定（100点）</text>
  <text x="320" y="473" text-anchor="middle" font-size="11.5" fill="#57606a">勝者確定後は 10 秒のクールダウン</text>

  <polyline points="190,306 190,340 250,340 250,364" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="332" font-size="11" fill="#1f2328">POST /add_point</text>

  <polyline points="690,154 690,340 420,340 420,364" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="702" y="250" font-size="11" fill="#1f2328">POST /add_point</text>

  <!-- 観客向けUI -->
  <rect x="620" y="380" width="220" height="100" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="730" y="412" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2328">ブラウザ</text>
  <text x="730" y="433" text-anchor="middle" font-size="11.5" fill="#57606a">web/index.html</text>
  <text x="730" y="455" text-anchor="middle" font-size="11.5" fill="#1f2328">観客向けスコア表示</text>

  <line x1="500" y1="430" x2="614" y2="430" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="557" y="420" text-anchor="middle" font-size="11" fill="#1f2328">GET /status</text>
  <text x="557" y="448" text-anchor="middle" font-size="11" fill="#57606a">1秒ごと</text>

  <!-- 勝利演出の一斉送信 -->
  <line x1="320" y1="490" x2="320" y2="532" stroke="#bc4c00" stroke-width="1.5"/>
  <line x1="117" y1="532" x2="763" y2="532" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="340" y="524" font-size="11.5" font-weight="600" fill="#bc4c00">勝利時に一斉送信 — POST /trigger_action（:5000）</text>

  <line x1="117" y1="532" x2="117" y2="554" stroke="#bc4c00" stroke-width="1.5" marker-end="url(#arrow-win)"/>
  <line x1="332" y1="532" x2="332" y2="554" stroke="#bc4c00" stroke-width="1.5" marker-end="url(#arrow-win)"/>
  <line x1="548" y1="532" x2="548" y2="554" stroke="#bc4c00" stroke-width="1.5" marker-end="url(#arrow-win)"/>
  <line x1="763" y1="532" x2="763" y2="554" stroke="#bc4c00" stroke-width="1.5" marker-end="url(#arrow-win)"/>

  <rect x="20" y="560" width="195" height="70" rx="8" fill="#fff4ec" stroke="#e8936c"/>
  <text x="117" y="586" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">モーター</text>
  <text x="117" y="605" text-anchor="middle" font-size="10.5" fill="#57606a">output_motor.js</text>
  <text x="117" y="621" text-anchor="middle" font-size="10.5" fill="#1f2328">I2C / PCA9685</text>

  <rect x="235" y="560" width="195" height="70" rx="8" fill="#fff4ec" stroke="#e8936c"/>
  <text x="332" y="586" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">LED</text>
  <text x="332" y="605" text-anchor="middle" font-size="10.5" fill="#57606a">output_led.js</text>
  <text x="332" y="621" text-anchor="middle" font-size="10.5" fill="#1f2328">GPIO 26</text>

  <rect x="450" y="560" width="195" height="70" rx="8" fill="#fff4ec" stroke="#e8936c"/>
  <text x="548" y="586" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">スピーカー</text>
  <text x="548" y="605" text-anchor="middle" font-size="10.5" fill="#57606a">output_speaker.js</text>
  <text x="548" y="621" text-anchor="middle" font-size="10.5" fill="#1f2328">GPIO 26</text>

  <rect x="665" y="560" width="195" height="70" rx="8" fill="#fff4ec" stroke="#e8936c"/>
  <text x="763" y="586" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">風船ポンプ</text>
  <text x="763" y="605" text-anchor="middle" font-size="10.5" fill="#57606a">output_balloon.js</text>
  <text x="763" y="621" text-anchor="middle" font-size="10.5" fill="#1f2328">GPIO 26</text>

  <text x="20" y="655" font-size="11" fill="#57606a">出力側 Raspberry Pi Zero ×4 — 各機で output_server.py（:5000）が命令を受信し、node スクリプトを実行する</text>
</svg>
