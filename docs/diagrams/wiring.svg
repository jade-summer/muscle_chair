<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', Meiryo, sans-serif">
  <title id="title">Muscle Chair デバイス配線図</title>
  <desc id="desc">入力側ではタッチセンサーがGPIO 5に接続される。出力側はモーター担当のPiがI2C経由でPCA9685とSG90サーボを駆動し、LED・スピーカー・ファンの3台はいずれもGPIO 26で接続されている。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect width="880" height="480" fill="#ffffff"/>

  <!-- 入力 -->
  <text x="30" y="38" font-size="12.5" font-weight="600" fill="#57606a">入力</text>

  <rect x="30" y="56" width="230" height="54" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="145" y="79" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">Raspberry Pi Zero</text>
  <text x="145" y="98" text-anchor="middle" font-size="11" fill="#57606a">input_touch_a.js</text>

  <line x1="266" y1="83" x2="414" y2="83" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="340" y="75" text-anchor="middle" font-size="11" fill="#1f2328">GPIO 5（入力）</text>

  <rect x="420" y="56" width="200" height="54" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="520" y="89" text-anchor="middle" font-size="12.5" fill="#1f2328">タッチセンサー</text>

  <!-- 出力 -->
  <text x="30" y="142" font-size="12.5" font-weight="600" fill="#bc4c00">出力（勝利演出）</text>

  <rect x="30" y="158" width="230" height="54" rx="8" fill="#fff4ec" stroke="#e8936c"/>
  <text x="145" y="181" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">Raspberry Pi Zero</text>
  <text x="145" y="200" text-anchor="middle" font-size="11" fill="#57606a">output_motor.js</text>

  <line x1="266" y1="185" x2="414" y2="185" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="340" y="177" text-anchor="middle" font-size="11" fill="#1f2328">I2C bus 1 / 0x40</text>

  <rect x="420" y="158" width="200" height="54" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="520" y="191" text-anchor="middle" font-size="12.5" fill="#1f2328">PCA9685</text>

  <line x1="626" y1="185" x2="714" y2="185" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="670" y="177" text-anchor="middle" font-size="11" fill="#1f2328">ch 0</text>

  <rect x="720" y="158" width="140" height="54" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="790" y="191" text-anchor="middle" font-size="12.5" fill="#1f2328">SG90 サーボ</text>

  <rect x="30" y="228" width="230" height="54" rx="8" fill="#fff4ec" stroke="#e8936c"/>
  <text x="145" y="251" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">Raspberry Pi Zero</text>
  <text x="145" y="270" text-anchor="middle" font-size="11" fill="#57606a">output_led.js</text>

  <line x1="266" y1="255" x2="414" y2="255" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="340" y="247" text-anchor="middle" font-size="11" fill="#1f2328">GPIO 26（出力）</text>

  <rect x="420" y="228" width="200" height="54" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="520" y="261" text-anchor="middle" font-size="12.5" fill="#1f2328">LED テープ</text>

  <rect x="30" y="298" width="230" height="54" rx="8" fill="#fff4ec" stroke="#e8936c"/>
  <text x="145" y="321" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">Raspberry Pi Zero</text>
  <text x="145" y="340" text-anchor="middle" font-size="11" fill="#57606a">output_speaker.js</text>

  <line x1="266" y1="325" x2="414" y2="325" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="340" y="317" text-anchor="middle" font-size="11" fill="#1f2328">GPIO 26（出力）</text>

  <rect x="420" y="298" width="200" height="54" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="520" y="331" text-anchor="middle" font-size="12.5" fill="#1f2328">スピーカー</text>

  <rect x="30" y="368" width="230" height="54" rx="8" fill="#fff4ec" stroke="#e8936c"/>
  <text x="145" y="391" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">Raspberry Pi Zero</text>
  <text x="145" y="410" text-anchor="middle" font-size="11" fill="#57606a">output_balloon.js</text>

  <line x1="266" y1="395" x2="414" y2="395" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="340" y="387" text-anchor="middle" font-size="11" fill="#1f2328">GPIO 26（出力）</text>

  <rect x="420" y="368" width="200" height="54" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="520" y="394" text-anchor="middle" font-size="12.5" fill="#1f2328">ファン</text>
  <text x="520" y="412" text-anchor="middle" font-size="11" fill="#57606a">筋肉風船を膨らませる</text>

  <text x="30" y="456" font-size="11" fill="#57606a">出力側の各機は独立した Raspberry Pi Zero のため、GPIO 26 が重複していても問題ない</text>
</svg>
